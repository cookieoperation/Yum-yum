<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Table</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1>Our Table</h1>
    <p class="tagline">The family's own map of good meals.</p>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="map" role="tab">Map</button>
    <button class="tab-btn" data-tab="places" role="tab">Places</button>
  </nav>
</header>

<main>
  <section id="tab-map" class="tab-panel active">
    <div id="map"></div>
  </section>

  <section id="tab-places" class="tab-panel">
    <div class="places-toolbar">
      <button id="add-restaurant-btn" class="btn btn-primary">Add a restaurant</button>
      <button id="set-home-btn" class="btn btn-quiet">Set home</button>
      <button id="set-hotel-btn" class="btn btn-quiet">Set hotel</button>
    </div>
    <div id="places-list" class="places-list"></div>
  </section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <img id="lightbox-img" src="" alt="" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
